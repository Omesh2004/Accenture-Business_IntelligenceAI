id: cost_per_acquisition
name: Cost Per Acquisition
definition: >
  Marketing spend divided by the number of customers who converted. Both sides come from the CRM,
  which refreshes weekly -- so a conversion recorded today may not be visible until the next
  batch, and a CPA computed on a partial week reads artificially high.
formula: sum(campaign_spend) / count(interactions where type = CONVERTED)
unit: currency
currency: USD
additivity: non_additive

grain:
  time: weekly
  entity: campaign

sources:
  - id: nexabank_crm
    system: ClickHouse.fact_campaign_interactions
    grain: interaction
    cadence: weekly
    freshness_sla_minutes: 10080
  - id: nexabank_core
    system: ClickHouse.fact_account_openings
    grain: account
    cadence: hourly_batch
    freshness_sla_minutes: 120

readiness:
  status: ready
  gate: >
    Interactions are stored as a funnel (SENT/OPENED/CLICKED/CONVERTED), never as a pre-computed
    conversion rate, so counts can be re-aggregated across segments without being wrong. Spend is
    the campaign's own recorded figure, not an estimate.

identity:
  interaction_id: required
  customer_id: hashed

# Conversions and touches are the additive fundamentals. Spend enters through the campaign
# dimension at read time; it is a campaign-level constant, not a per-interaction measure, so
# summing it per row would multiply it by the funnel size.
fundamentals:
  - metric: conversions
    table: fact_campaign_interactions
    measure: "1"
    aggregation: count
    filter:
      interaction_type: CONVERTED
    additivity: additive
    engine_type: sql
  - metric: campaign_touches
    table: fact_campaign_interactions
    measure: "1"
    aggregation: count
    filter:
      interaction_type: SENT
    additivity: additive
    engine_type: sql

dimensions:
  allowed: [channel, campaign_name, risk_segment, region]
  max_depth: 2
  min_segment_volume: 3
  availability:
    channel: {seeded: true, live: true}
    campaign_name: {seeded: true, live: true}
    risk_segment: {seeded: true, live: true}
    region: {seeded: true, live: true}

quality:
  # Weekly grain: a streaming SLA can never pass here, which is precisely why freshness is
  # grain-scaled rather than global.
  freshness_sla_minutes: 10080
  provisional_window_minutes: 1440
  hard_invariants:
    - id: conversions_non_negative
      expr: conversions >= 0
      on_fail: quarantine
    - id: conversions_within_funnel
      expr: conversions <= campaign_touches
      on_fail: quarantine
      note: "More conversions than sends is a duplicated interaction load, not a great campaign."
  soft_invariants:
    - id: funnel_plausible
      expr: conversions / campaign_touches BETWEEN 0 AND 0.5
      on_fail: ambiguous
      note: >
        A conversion rate above half is far more likely to be an attribution join gone wide than
        real performance. Abstain and name the check.
  defect_fingerprints:
    - id: partial_week
      signature: "conversions drop sharply while campaign_touches is unchanged"
      verdict: ambiguous
      note: "The weekly batch has landed sends but not yet the conversions that follow them."
    - id: crm_not_loaded
      signature: "campaign_touches == 0 while account openings are unchanged"
      verdict: fail

detection:
  direction: both
  band_source: forecast
  warn_pct_change: 15
  critical_pct_change: 35
  min_persistence_windows: 1
  min_denominator: 5
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 14
  baseline: rolling_median
  interval_required: true
  fallback: rolling_median
  # Weekly grain needs a longer history before a band means anything.
  min_history_days: 28

causal:
  enabled: true
  evidence_rungs: [association, attribution, corroborated_cause]
  interventions: [campaign]
  control_dimensions: [channel, risk_segment]
  degrade_to: attribution

decision:
  owner: marketing_ops
  allowed_levers: [reallocate_campaign_spend, pause_campaign, retarget_segment, investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  tables: [fact_campaign_interactions, dim_campaign, fact_account_openings]
  sources: [nexabank_crm, nexabank_core]
  note: >
    Spend is attributed to the campaign, not spread evenly across days, so CPA is a window-level
    figure rather than a daily series. Reading it as a daily rate would imply a precision the
    source does not have.

access_restriction:
  visible_to: [cfo, analyst]
  suppress_for_others: [campaign_spend]

observability:
  golden_scenarios: [real_movement, low_confidence]
  verifier_required: true
  engine_type: sql

interconnection:
  drives: [new_account_openings]
