id: digital_adoption_rate
name: Digital Adoption Rate
definition: >
  Share of transactions completed on a digital channel (mobile or web) rather than a physical one
  (ATM or branch counter). A ratio, so the contract declares the two additive counts it is built
  from and Localize works on those; the rate itself is never sliced.
formula: digital_transactions / total_transactions
unit: ratio
additivity: non_additive

grain:
  time: daily
  entity: transaction

sources:
  - id: nexabank_core
    system: ClickHouse.fact_transactions
    grain: transaction
    cadence: hourly_batch
    freshness_sla_minutes: 120
  - id: market_ops
    system: ClickHouse.dim_branch
    grain: branch
    cadence: monthly
    freshness_sla_minutes: 44640

readiness:
  status: ready
  gate: >
    channel is a real column on fact_transactions carried from the core banking system, not the
    synthesised per-session channel on the clickstream path. That distinction is why this KPI may
    be trusted where a telemetry channel split may not.

identity:
  txn_id: required

# Numerator and denominator, both additive. Never the ratio: a rate cannot be re-aggregated
# across dimensions, and localizing one produces contributions that do not mean anything.
fundamentals:
  - metric: digital_transactions
    table: fact_transactions
    measure: "1"
    aggregation: count
    filter:
      channel: [WEB, MOBILE]
      status: SUCCESS
    additivity: additive
    engine_type: sql
  - metric: total_transactions
    table: fact_transactions
    measure: "1"
    aggregation: count
    filter:
      status: SUCCESS
    additivity: additive
    engine_type: sql

dimensions:
  allowed: [region, branch_code, txn_type, category]
  max_depth: 2
  min_segment_volume: 5
  availability:
    region: {seeded: true, live: true}
    branch_code: {seeded: true, live: true}
    txn_type: {seeded: true, live: true}
    category: {seeded: true, live: true}

quality:
  freshness_sla_minutes: 120
  provisional_window_minutes: 60
  hard_invariants:
    - id: digital_subset_of_total
      expr: digital_transactions <= total_transactions
      on_fail: quarantine
      note: "The classic funnel defect: a numerator exceeding its denominator is a join fan-out."
    - id: denominator_present
      expr: total_transactions > 0
      on_fail: quarantine
  soft_invariants:
    - id: rate_within_unit_interval
      expr: digital_transactions / total_transactions BETWEEN 0 AND 1
      on_fail: ambiguous
  defect_fingerprints:
    - id: channel_unmapped
      signature: "digital_transactions == 0 while total_transactions is unchanged"
      verdict: fail
      note: "A renamed channel value reads as total abandonment of digital, which it never is."

detection:
  direction: both
  band_source: forecast
  warn_pct_change: 5
  critical_pct_change: 12
  min_persistence_windows: 2
  min_denominator: 25
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 7
  baseline: seasonal_naive
  interval_required: true
  fallback: rolling_median
  min_history_days: 14

causal:
  enabled: true
  evidence_rungs: [association, attribution]
  interventions: [campaign, branch_staffing_change]
  external_factors:
    - source: market_ops
      table: dim_branch
      fields: [staffing_headcount]
      join_on: branch_code
  control_dimensions: [region, txn_type]
  degrade_to: association

decision:
  owner: digital_channels
  allowed_levers: [promote_mobile_app, review_branch_staffing, investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  tables: [fact_transactions, dim_branch]
  sources: [nexabank_core, market_ops]
  note: >
    Branch staffing is joined only as context for a physical-channel shift. It is never a
    fundamental: a headcount is a stock, and summing it across a window would be meaningless.

access_restriction:
  visible_to: [cfo, ops_manager, analyst]
  suppress_for_others: []

observability:
  golden_scenarios: [real_movement]
  verifier_required: true
  engine_type: sql

interconnection:
  driven_by: net_deposit_growth
