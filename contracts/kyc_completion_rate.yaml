id: kyc_completion_rate
name: KYC Completion Rate
definition: >
  The share of loan applications that complete identity verification. An application enters at
  step 1 and either walks to step 3 or stalls; the rate is completions divided by submissions.
formula: kyc_completed / kyc_started
unit: ratio
additivity: non-additive     # the RATE is not additive; its two counts are

grain:
  time: daily
  entity: application

# The value comes from core banking, not the clickstream. The clickstream sees a customer start
# KYC in the UI but covers only the sampled population, and its dimensions are synthesised per
# session -- so it corroborates behaviour and never produces the number.
sources:
  - id: nexabank_core
    system: ClickHouse.fact_loan_applications
    grain: application
    cadence: hourly_batch
    freshness_sla_minutes: 120
  - id: nexabank_clickstream
    system: ClickHouse.events_raw
    grain: event
    cadence: real_time
    freshness_sla_minutes: 15
    role: corroboration

readiness:
  status: ready
  gate: >
    kyc_step is written by the source of record on every application. The clickstream must never
    be used as the denominator: it counts UI starts, not submissions.

identity:
  application_id: required
  customer_id: hashed

# Addressed as (kpi_id, fundamental) against gold.kpi_daily -- see
# docs/INTERFACES/kpi_rollups.md. The table/event forms are no longer supported.
fundamentals:
  - kpi_id: kyc_completion_rate
    fundamental: kyc_completed
    additivity: additive
    engine_type: sql
    role: numerator
  - kpi_id: kyc_completion_rate
    fundamental: kyc_started
    additivity: additive
    engine_type: sql
    role: denominator

dimensions:
  # Every one is a measured column on the fact, not a per-session fabrication.
  allowed: [loan_type, risk_segment, region, branch_code]
  max_depth: 2
  min_segment_volume: 15
  availability:
    region: {seeded: true, live: true}
    country: {seeded: true, live: true}
    branch_code: {seeded: true, live: true}
    risk_segment: {seeded: true, live: true}
    loan_type: {seeded: true, live: true}
  excluded:
    - key: kyc_step
      reason: "It is the measure itself; slicing the rate by its own numerator is circular."
    - key: location
      reason: "Synthesised per session by the producer. Ranked, confident and meaningless."
    - key: device_type
      reason: "Synthesised per session by the producer."

quality:
  freshness_sla_minutes: 120
  provisional_window_minutes: 60
  hard_invariants:
    - id: completed_subset
      expr: kyc_completed <= kyc_started
      on_fail: quarantine
      note: "Arithmetic: a completion that is not a submission is a defect."
    - id: source_present
      expr: kyc_started > 0
      on_fail: quarantine
  soft_invariants:
    - id: clickstream_reconciliation
      expr: kyc_started >= clickstream_kyc_starts * 0.2
      on_fail: ambiguous
      note: >
        The clickstream covers a sampled population and lags by up to an hour, so the two
        legitimately disagree. Abstain and name the check; never quarantine on it.
  defect_fingerprints:
    - id: batch_not_loaded
      signature: "kyc_started == 0 while the clickstream still shows KYC starts"
      verdict: fail
    - id: step_frozen
      signature: "kyc_completed == 0 for a full window while submissions continue"
      verdict: ambiguous

# What a movement here is worth to the bank; Materiality ranks by it.
strategic_weight: 0.75

detection:
  direction: both
  band_source: robust_baseline
  warn_pct_change: 8
  critical_pct_change: 15
  min_persistence_windows: 2
  min_denominator: 30
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 7
  baseline: seasonal_naive
  interval_required: true
  fallback: rolling_median
  min_history_days: 14

causal:
  enabled: true
  evidence_rungs: [association, attribution, corroborated_cause]
  interventions: [campaign, kyc_vendor_change, document_policy_change]
  control_dimensions: [loan_type, risk_segment]
  degrade_to: attribution

decision:
  owner: onboarding_ops
  allowed_levers: [fix_kyc_step, review_document_rules, adjust_messaging, escalate_vendor,
                   investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  tables: [fact_loan_applications, events_raw]
  sources: [nexabank_core, nexabank_clickstream]
  events: [loan.kyc_started.success, loan.kyc_completed.success]

access_restriction:
  visible_to: [cfo, ops_manager, analyst, risk_officer, data_steward]

observability:
  golden_scenarios: [real_movement, sparse_history, cross_source_lag]
  verifier_required: true
  engine_type: sql

interconnection:
  driven_by: signups
  drives: loan_approval_volume
