id: loan_approval_rate
name: Loan Approval Rate
definition: >
  The share of submitted loan applications that reach APPROVED. The outcome lives only in core
  banking; the clickstream can see an application start but never its decision.
formula: approved_applications / submitted_applications
unit: ratio
additivity: non-additive     # the RATE is not additive; its fundamentals are

grain:
  time: daily
  entity: application

# The cross-source KPI. Its numerator and denominator come from a BATCH source while the
# funnel that feeds it is real-time -- the two disagree for up to an hour by construction,
# which is why the reconciliation invariant below is soft rather than hard.
sources:
  - id: nexabank_core
    system: ClickHouse.fact_loan_applications
    grain: application
    cadence: hourly_batch
    freshness_sla_minutes: 120
  - id: nexabank_clickstream
    system: ClickHouse.events_raw
    grain: event
    cadence: real_time
    freshness_sla_minutes: 15
    role: corroboration

readiness:
  status: ready
  blockers:
    - id: application-status-mutates
      status: resolved
      detail: >
        An application moves PENDING -> KYC_PENDING -> APPROVED/REJECTED, so an append-only copy
        would keep the first status forever and the approval rate would read near zero.
      fix: >
        fact_loan_applications is ReplacingMergeTree(_version) keyed on application_id, with
        _version set to the source's updatedOn, and the extract cursor is updatedOn rather than
        createdOn so a status change is re-extracted. Reads use FINAL.
  gate: >
    Outcomes are instrumented on the batch path. The clickstream corroborates direction only;
    it must never be used as the denominator, because it counts starts and not submissions.

identity:
  application_id: required
  customer_id: hashed

fundamentals:
  - metric: approved_applications
    table: fact_loan_applications
    measure: "1"
    aggregation: count
    filter:
      status: APPROVED
    additivity: additive
    engine_type: sql
  - metric: submitted_applications
    table: fact_loan_applications
    measure: "1"
    aggregation: count
    additivity: additive
    engine_type: sql

dimensions:
  # Columns on the fact table. loan_type and term are business attributes the clickstream
  # never carried; they are measured, not synthesised.
  allowed: [loan_type, status]
  max_depth: 2
  min_segment_volume: 3
  availability:
    loan_type: {seeded: true, live: true}
    status: {seeded: true, live: true}
  excluded:
    - key: kyc_step
      reason: "Varies within an application, so counts are not additive across it."

quality:
  freshness_sla_minutes: 120
  provisional_window_minutes: 60
  hard_invariants:
    - id: approved_subset
      expr: approved_applications <= submitted_applications
      on_fail: quarantine
      note: "Arithmetic, not business: an approval that is not a submission is a defect."
    - id: source_present
      expr: submitted_applications > 0
      on_fail: quarantine
  soft_invariants:
    - id: funnel_reconciliation
      expr: submitted_applications <= clickstream_kyc_completions * 2
      on_fail: ambiguous
      note: >
        The batch source lags the clickstream by up to an hour, so the two legitimately
        disagree at a window edge. Abstain and name the check; never quarantine on it.
  defect_fingerprints:
    - id: batch_not_loaded
      signature: "submitted_applications == 0 while loan.applied.success is unchanged"
      verdict: fail
    - id: status_frozen
      signature: "approved_applications == 0 for a full window while submissions continue"
      verdict: ambiguous

detection:
  direction: down
  band_source: forecast
  warn_pct_change: 10
  critical_pct_change: 20
  min_persistence_windows: 2
  min_denominator: 5
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 7
  baseline: seasonal_naive
  interval_required: true
  fallback: rolling_median
  min_history_days: 14

causal:
  enabled: true
  evidence_rungs: [association, attribution, corroborated_cause]
  interventions: [campaign, credit_policy_change]
  control_dimensions: [loan_type]
  degrade_to: attribution

decision:
  owner: lending_ops
  allowed_levers: [review_approval_rules, fix_kyc_step, adjust_messaging, investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  tables: [fact_loan_applications, events_raw]
  sources: [nexabank_core, nexabank_clickstream]
  events: [loan.kyc_completed.success, loan.applied.success]

access_restriction:
  visible_to: [cfo, ops_manager, analyst]

observability:
  golden_scenarios: [real_movement, sparse_history, cross_source_lag]
  verifier_required: true
  engine_type: sql

interconnection:
  driven_by: kyc_completion_rate
  drives: fee_revenue
