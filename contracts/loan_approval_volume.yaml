id: loan_approval_volume
name: Loan Approval Volume
definition: >
  The count of loan applications that reach approved status during the reporting window.
formula: approved_loan_applications
unit: count
additivity: additive

# A pure count localizes at EVENT grain: every event belongs to exactly one dimension cell,
# so sum(cells) == total holds for any event-level attribute. Contrast kyc_completion_rate,
# which is a ratio and must localize at session grain.
grain:
  time: daily
  entity: event

readiness:
  status: ready
  blockers:
    - id: approval-not-instrumented
      status: resolved
      detail: >
        NexaBank calls trackEvent("loan_approved") in loanRoutes.ts:214. "loan_approved" was
        absent from LEGACY_MAP in eventTracker.ts, so enforceTaxonomy fell through to its generic
        wrapper and emitted core.loan_approved.action, which canonicalize_event_name left
        unchanged. This KPI read exactly zero rows, silently.
      fix: >
        Added 'loan_approved': 'loans.approved.success' to LEGACY_MAP. Verified live:
        canonicalize_event_name('loans.approved.success') == 'loan.approved.success'.
    - id: applied-misrouted
      status: resolved
      detail: >
        'loan_applied' mapped to loans.submit_application.success, which canonicalized to
        loan.submit_application.success -- not loan.applied.success. The denominator was
        stranded on the live path. scripts/seed_data.py emits loan.applied.success directly,
        so seeded demo data was unaffected.
      fix: "Remapped 'loan_applied' to 'loans.applied.success'. Verified live:
        canonicalize_event_name('loans.applied.success') == 'loan.applied.success'."
    - id: no-seeded-approvals
      status: resolved
      detail: "scripts/seed_data.py emitted no loan.approved.* event, so even seeded data was empty."
      fix: "Added 'loan.approved.success' to FREE_EVENTS in scripts/seed_data.py."
    - id: simulate-path-never-approves
      status: resolved
      affects: [live]
      detail: >
        POST /events/simulate created LoanApplication rows but never approved one, so this
        KPI's numerator had no source on the simulate path at all -- loan.approved.success
        arrived only when a human clicked Approve in the admin UI (loanRoutes.ts:214). The
        denominator (loan.applied.success) was generated in volume, so the ratio read as a
        permanent near-total collapse rather than as missing instrumentation.
      fix: >
        The simulate route now approves a share of KYC-complete applications and emits
        trackEvent("loan_approved"), the LEGACY_MAP key verified to resolve to
        loan.approved.success. The share is the `loans.approvalRate` behaviour knob, so an
        operator can move this KPI deliberately from the simulation console.
  unblocked_by: [FOUNDATION-1, FOUNDATION-3]
  gate: >
    Both fundamentals are instrumented on seeded and live paths. Ordinary Trust Gate invariant
    checks (dedup_integrity, source_present, approval_subset) still apply per run.

source:
  name: nexabank_clickstream
  system: ClickHouse.events_raw
  cadence: real-time
  event_time: timestamp

identity:
  event_id: required
  session_id: optional        # not needed: event-grain counts are additive without it
  user_id: hashed

fundamentals:
  - metric: approved_loan_applications
    event: loan.approved.success
    aggregation: uniqExact(event_id)   # dedup-safe count; plain count() is not replay-safe
    additivity: additive
    engine_type: sql
  - metric: submitted_loan_applications
    event: loan.applied.success
    aggregation: uniqExact(event_id)
    additivity: additive
    engine_type: sql

dimensions:
  # Physical metadata keys. `location` holds a country value (known naming debt).
  # Event grain: every event sits in exactly one cell, so these are additive by construction.
  # NOTE: `channel` is a top-level events_raw COLUMN, not a metadata key. Every other
  # dimension here is read with JSONExtractString(metadata, ...); channel must be read
  # directly. Reading it from the JSON returns empty on every row.
  allowed: [device_type, location, channel, continent]
  max_depth: 3
  min_segment_volume: 10
  availability:
    device_type: {seeded: true, live: true}   # FOUNDATION-2: session-cached, no longer re-rolled per event
    location: {seeded: true, live: true}      # FOUNDATION-2: session-cached, no longer re-rolled per event
    channel: {seeded: true, live: true}
    continent: {seeded: true, live: true}
  excluded:
    - key: tier
      reason: "Live path only; absent from scripts/seed_data.py metadata."

quality:
  freshness_sla_minutes: 30
  provisional_window_minutes: 10
  hard_invariants:
    - id: dedup_integrity
      expr: count() == uniqExact(event_id)
      on_fail: quarantine
    - id: source_present
      expr: approved_loan_applications > 0
      on_fail: quarantine
      note: "Guards the silent-zero failure described in readiness.blockers."
  soft_invariants:
    - id: approval_subset
      expr: approved_loan_applications <= submitted_loan_applications
      on_fail: ambiguous
      note: "An approval may land in a window after its application; small violations are legitimate."
  corroboration:
    - loan.kyc_completed.success
  defect_fingerprints:
    - id: duplicate_event_storm
      signature: "count() >> uniqExact(event_id) within the anomaly window"
      verdict: fail
    - id: taxonomy_misroute
      signature: "volume collapses to zero while upstream loan.applied.success is unchanged"
      verdict: fail

detection:
  direction: down
  band_source: forecast
  warn_pct_change: 10
  critical_pct_change: 20
  min_persistence_windows: 2
  min_denominator: 10
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 7
  baseline: seasonal_naive
  interval_required: true
  fallback: rolling_median
  min_history_days: 14

causal:
  enabled: true
  evidence_rungs: [association, attribution, corroborated_cause, estimated_effect]
  interventions: [simulator_anomaly, campaign, release]
  control_dimensions: [location, channel]
  degrade_to: attribution

decision:
  owner: lending_ops
  allowed_levers: [review_approval_rules, fix_kyc_step, investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  events: [loan.applied.success, loan.approved.success, loan.kyc_completed.success]
  endpoint: /features/usage
  tables: [events_raw, daily_feature_usage]

access_restriction:
  visible_to: [cfo, ops_manager, analyst]

observability:
  golden_scenarios: [real_movement, sparse_history]
  verifier_required: true
  engine_type: sql

interconnection:
  driven_by: kyc_completion_rate
  drives: pro_revenue
