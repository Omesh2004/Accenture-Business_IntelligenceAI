id: loan_approval_volume
name: Loan Approval Volume
definition: >
  The number of loan applications approved each day, counted on the day the decision was made.
  The lending output of the chain: onboarding completion gates it, and it drives interest revenue.
formula: count(applications where status = APPROVED)
unit: count
additivity: additive

grain:
  time: daily
  entity: application

sources:
  - id: nexabank_core
    system: ClickHouse.fact_loan_applications
    grain: application
    cadence: hourly_batch
    freshness_sla_minutes: 120

readiness:
  status: ready
  gate: >
    Counted on decided_at, never created_at. An application created in one window and approved in
    the next belongs to the window it was approved in; counting on creation reports the decision
    before it happened and makes the series a copy of application volume.

identity:
  application_id: required
  customer_id: hashed

fundamentals:
  - metric: approved_applications
    table: fact_loan_applications
    measure: "1"
    aggregation: count
    time_column: decided_at
    filter:
      status: APPROVED
    additivity: additive
    engine_type: sql
  - metric: approved_principal
    table: fact_loan_applications
    measure: principal_amount
    aggregation: sum
    time_column: decided_at
    filter:
      status: APPROVED
    additivity: additive
    engine_type: sql

dimensions:
  allowed: [loan_type, region, country, branch_code, risk_segment]
  max_depth: 2
  min_segment_volume: 10
  availability:
    loan_type: {seeded: true, live: true}
    region: {seeded: true, live: true}
    country: {seeded: true, live: true}
    branch_code: {seeded: true, live: true}
    risk_segment: {seeded: true, live: true}
  excluded:
    - key: status
      reason: "It is the filter that defines the measure."
    - key: term_months
      reason: "Continuous; bucket it before it can be a cube dimension."

quality:
  freshness_sla_minutes: 120
  provisional_window_minutes: 60
  hard_invariants:
    - id: non_negative
      expr: approved_applications >= 0
      on_fail: quarantine
    - id: principal_present
      expr: approved_principal >= 0
      on_fail: quarantine
  soft_invariants:
    - id: gated_by_onboarding
      expr: approved_applications <= kyc_completed_applications
      on_fail: ambiguous
      note: >
        An approval normally follows a completed KYC, but the two are counted on different days
        -- decided_at against created_at -- so the inequality breaks legitimately at a window
        edge. Abstain, never quarantine.
  defect_fingerprints:
    - id: batch_not_loaded
      signature: "approved_applications == 0 while submissions continue"
      verdict: fail
    - id: decision_lag_stall
      signature: "approved_applications flat while submitted_applications rises sharply"
      verdict: ambiguous

detection:
  direction: both
  band_source: robust_baseline
  warn_pct_change: 15
  critical_pct_change: 30
  min_persistence_windows: 2
  min_denominator: 10
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 7
  baseline: seasonal_naive
  interval_required: true
  fallback: rolling_median
  min_history_days: 14

causal:
  enabled: true
  evidence_rungs: [association, attribution, corroborated_cause]
  interventions: [credit_policy_change, campaign, rate_change]
  control_dimensions: [loan_type, risk_segment]
  degrade_to: attribution

decision:
  owner: lending_ops
  allowed_levers: [review_approval_rules, adjust_risk_thresholds, add_underwriting_capacity,
                   adjust_messaging, investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  tables: [fact_loan_applications]
  sources: [nexabank_core]

access_restriction:
  visible_to: [cfo, ops_manager, analyst, risk_officer, data_steward]

observability:
  golden_scenarios: [real_movement, multi_factor, sparse_history]
  verifier_required: true
  engine_type: sql

interconnection:
  driven_by: kyc_completion_rate
  drives: revenue
