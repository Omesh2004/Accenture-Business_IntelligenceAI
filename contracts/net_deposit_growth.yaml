id: net_deposit_growth
name: Net Deposit Growth
definition: >
  Deposits received minus withdrawals paid out, across a region. Merchant spend is deliberately
  excluded: money leaving to a shop is consumption, money leaving to another institution is
  deposit flight, and conflating them hides the movement this KPI exists to surface.
formula: sum(deposit_amount) - sum(withdrawal_amount)
unit: currency
currency: USD
additivity: additive

grain:
  time: monthly
  entity: transaction

# Three sources. The internal pair explains WHERE the money went; the macro source is the only
# place that can explain WHY, and it refreshes monthly while transactions refresh hourly.
sources:
  - id: nexabank_core
    system: ClickHouse.fact_transactions
    grain: transaction
    cadence: hourly_batch
    freshness_sla_minutes: 120
  - id: market_ops
    system: ClickHouse.dim_macro_environment
    grain: region_month
    cadence: monthly
    freshness_sla_minutes: 44640
  - id: nexabank_crm
    system: ClickHouse.dim_customer
    grain: customer
    cadence: weekly
    freshness_sla_minutes: 10080

readiness:
  status: ready
  gate: >
    fact_transactions carries branch_code and region from the account's branch of record, so the
    regional split is measured rather than inferred from a geo guess. Amounts are Decimal(18,2)
    carried from the core banking system.

identity:
  txn_id: required
  customer_id: hashed

# Two additive fundamentals, never the net figure directly: a difference of sums is additive
# across dimensions, a stored net is not re-aggregatable once sliced.
fundamentals:
  - metric: deposit_amount
    table: fact_transactions
    measure: amount
    aggregation: sum
    filter:
      txn_type: DEPOSIT
      status: SUCCESS
    # A loan disbursement credits the customer's account, but it is the bank's money going out,
    # not a deposit coming in. Counting it here makes a lending push read as deposit growth --
    # which is exactly backwards for a KPI about funding.
    exclude:
      category: Loan Disbursement
    additivity: additive
    engine_type: sql
  - metric: withdrawal_amount
    table: fact_transactions
    measure: amount
    aggregation: sum
    filter:
      txn_type: WITHDRAWAL
      status: SUCCESS
    additivity: additive
    engine_type: sql

decomposition:
  enabled: true
  method: lmdi_i
  factors: [volume, mix, price]
  mix_dimensions: [region, channel]
  residual_tolerance: 0.000001

dimensions:
  # Real columns on fact_transactions. region and branch_code come from the account's branch,
  # which is invariant within a transaction, so contributions are meaningful rather than dice.
  allowed: [region, country, branch_code, channel, txn_type, category]
  max_depth: 2
  min_segment_volume: 3
  availability:
    region: {seeded: true, live: true}
    branch_code: {seeded: true, live: true}
    channel: {seeded: true, live: true}
    txn_type: {seeded: true, live: true}
    category: {seeded: true, live: true}

quality:
  freshness_sla_minutes: 120
  provisional_window_minutes: 60
  hard_invariants:
    - id: deposits_non_negative
      expr: deposit_amount >= 0
      on_fail: quarantine
    - id: withdrawals_non_negative
      expr: withdrawal_amount >= 0
      on_fail: quarantine
  soft_invariants:
    - id: outflow_not_absurd
      expr: withdrawal_amount / deposit_amount BETWEEN 0 AND 10
      on_fail: ambiguous
      note: >
        Withdrawals many times deposits is more likely a loader replaying one side than a bank
        run. Abstain and name the check rather than narrating a collapse.
  defect_fingerprints:
    - id: one_sided_load
      signature: "withdrawal_amount unchanged while deposit_amount drops to zero"
      verdict: fail
    - id: stale_macro
      signature: "market_ops beyond its monthly SLA while transaction volume is normal"
      verdict: ambiguous

detection:
  direction: both
  band_source: forecast
  warn_pct_change: 8
  critical_pct_change: 15
  min_persistence_windows: 2
  min_denominator: 10
  robust_scorer: mad
  multiple_testing: benjamini_hochberg
  sparse_history_policy: abstain_with_interval

forecast:
  enabled: true
  horizon_days: 7
  baseline: seasonal_naive
  interval_required: true
  fallback: rolling_median
  min_history_days: 14

# The multi-factor scenario. An internal segment alone does not explain a deposit outflow; the
# competitor rate in market_ops is the external factor that completes it. Causal may only reach
# corroborated_cause when BOTH are present, and must degrade to attribution otherwise.
causal:
  enabled: true
  evidence_rungs: [association, attribution, corroborated_cause]
  interventions: [campaign, rate_change, competitor_rate_move]
  external_factors:
    - source: market_ops
      table: dim_macro_environment
      fields: [competitor_deposit_rate, central_bank_base_rate, regional_unemployment_rate]
      join_on: region
  control_dimensions: [region, channel]
  degrade_to: attribution

decision:
  owner: retail_banking
  allowed_levers: [adjust_savings_yield, branch_retention_outreach, investigate]
  requires_human_approval: true
  expected_impact: interval

lineage:
  tables: [fact_transactions, dim_macro_environment, dim_customer]
  sources: [nexabank_core, market_ops, nexabank_crm]
  note: >
    Region reaches a transaction through the account's branch of record, not through the
    clickstream's synthesised geo. That is why this KPI may localize on region while the
    telemetry KPIs may not.

access_restriction:
  visible_to: [cfo, ops_manager, analyst, data_steward]
  suppress_for_others: []

observability:
  golden_scenarios: [real_movement, multi_factor]
  verifier_required: true
  engine_type: sql

interconnection:
  drives: [digital_adoption_rate]
  driven_by: new_account_openings
