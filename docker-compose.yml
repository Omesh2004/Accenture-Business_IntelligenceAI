services:
  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  broker:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Without this, dependents start as soon as the CONTAINER starts rather than when Kafka
    # is accepting connections. ingestion-api lost that race every time, gave up, and ran on
    # the ClickHouse fallback for its whole lifetime -- silently, since it never crashed.
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  init-kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      broker:
        condition: service_healthy
    restart: on-failure
    command: "bash -c 'echo Waiting for Kafka to be ready... && cub kafka-ready -b broker:29092 1 120 && kafka-topics --create --topic feature-events --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server broker:29092'"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DB: feature_intelligence
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      # P0-1: today() is server-local. Unpinned, the KPI card, the traffic chart and the rollup
      # bucket the same event into different days.
      TZ: UTC
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ═══════════════════════════════════════════════════════════
  # NUCLEUS PYTHON BACKEND SERVICES
  # ═══════════════════════════════════════════════════════════

  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DEPLOYMENT_MODE=CLOUD
      - KAFKA_BROKER_URL=broker:29092
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  processor-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - KAFKA_BROKER_URL=broker:29092
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
    command: python processing/worker.py
    restart: unless-stopped

  intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - INTELLIGENCE_TENANTS=nexabank,safexbank
      - INTELLIGENCE_WINDOW_DAYS=7
      - INTELLIGENCE_DATASET=seeded
      - EXTRACT_API_URL=http://nexabank-backend:5000/api
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
      - INTELLIGENCE_LLM=${INTELLIGENCE_LLM:-0}
      - VLLM_URL=http://host.docker.internal:11434/v1
    volumes:
      - ./api:/app/api
    command: python api/intelligence/service.py
    restart: unless-stopped

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - DEPLOYMENT_MODE=CLOUD
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - VLLM_URL=http://host.docker.internal:11434/v1
      - INTELLIGENCE_LLM=${INTELLIGENCE_LLM:-0}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # vLLM High-Throughput Inference Server
  # ═══════════════════════════════════════════════════════════

  vllm-server:
    # Opt-in: needs an NVIDIA GPU. `docker compose --profile gpu up vllm-server`
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    container_name: nucleus-vllm
    ports:
      - "8002:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
      - ./vllm_entrypoint.sh:/app/vllm_entrypoint.sh:ro
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Pin the weights instead of letting free VRAM choose a tier. Empty = auto-select.
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VLLM_MAX_LEN=${VLLM_MAX_LEN:-}
      - VLLM_GPU_UTIL=${VLLM_GPU_UTIL:-}
      # vLLM's CUDA platform disables pinned memory on WSL2 by default. Its V1 GPU model runner
      # then cannot build a UVA buffer and the engine dies with "UVA is not available" before
      # loading a single weight. Pinned memory does work on WSL2 kernels >= 4.19.121, which is
      # every current one; this opts back in. Harmless on native Linux, where the WSL branch is
      # never taken.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=${VLLM_WSL2_ENABLE_PIN_MEMORY:-1}
      # huggingface_hub's Xet transfer path fails mid-download behind some networks with
      # "CAS Client Error: Request middleware error", and the engine dies before loading a weight.
      # Plain HTTPS is slower on a cold pull and survives a flaky link.
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    entrypoint: ["/bin/bash", "/app/vllm_entrypoint.sh"]
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ANALYTICS DASHBOARD — port 3001
  # ═══════════════════════════════════════════════════════════

  analytics-dashboard:
    build:
      context: ./analytics-dashboard
      dockerfile: Dockerfile
    container_name: nucleus-analytics-dashboard
    ports:
      - "3001:3001"
    environment:
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=nucleus-analytics-secret-key-2026
      - ANALYTICS_API_HOST=analytics-api
      - INGESTION_API_HOST=ingestion-api
      - NEXT_PUBLIC_ANALYTICS_WS_URL=ws://analytics-api:8001
      - NEXT_MODE=${NEXT_MODE:-development}
    env_file:
      - ./analytics-dashboard/.env.local
    volumes:
      # Mount central RBAC config
      - ./rbac.json:/rbac.json:ro
      # Hot-reload: mount source directories
      - ./analytics-dashboard/src:/app/src
      - ./analytics-dashboard/lib:/app/lib
      - ./analytics-dashboard/components:/app/components
      - ./analytics-dashboard/public:/app/public
      - ./analytics-dashboard/types:/app/types
    depends_on:
      - analytics-api
      - ingestion-api
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # NEXABANK — Backend (5000) + Frontend (3002)
  # ═══════════════════════════════════════════════════════════

  nexabank-backend:
    build:
      context: ./NexaBank/backend
      dockerfile: Dockerfile
    container_name: nexabank-backend
    ports:
      - "5000:5000"
    env_file:
      - ./NexaBank/backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:3002
      - INGESTION_API_URL=http://ingestion-api:8000/events
      # Shared secret for the batch extract; the endpoints refuse to serve without it.
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
    volumes:
      # Hot-reload: mount source code (but NOT node_modules)
      - ./NexaBank/backend/src:/app/src
      - ./NexaBank/backend/prisma:/app/prisma
    restart: unless-stopped

  nexabank-frontend:
    build:
      context: ./NexaBank/frontend
      dockerfile: Dockerfile
    container_name: nexabank-frontend
    ports:
      - "3002:3002"
    environment:
      - NEXT_MODE=${NEXT_MODE:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      # Hot-reload: mount source directories
      - ./NexaBank/frontend/app:/app/app
      - ./NexaBank/frontend/components:/app/components
      - ./NexaBank/frontend/hooks:/app/hooks
      - ./NexaBank/frontend/lib:/app/lib
      - ./NexaBank/frontend/src:/app/src
      - ./NexaBank/frontend/types:/app/types
      - ./NexaBank/frontend/public:/app/public
    depends_on:
      - nexabank-backend
      - ingestion-api
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════
# PERSISTENT VOLUMES — survive `docker compose down`
# Only removed with `docker compose down -v`
# ═══════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════
  # Test runner — dev deps stay out of every runtime image.
  #   docker compose --profile test run --rm tests
  # ═══════════════════════════════════════════════════════════

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - DEPLOYMENT_MODE=CLOUD
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      # Service names, not localhost: inside a container localhost is the container itself, and
      # scripts/seed_data.py would post every scenario event into the void and report success.
      - INGEST_URL=http://ingestion-api:8000/events
      - ANALYTICS_URL=http://analytics-api:8001/metrics/realtime_users
      - EXTRACT_API_URL=http://nexabank-backend:5000/api
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
    volumes:
      # Mounted, not baked: a gate that lints reader.py must see the working copy.
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./api:/app/api:ro
      - ./contracts:/app/contracts:ro
      # Entitlement config the persona tests assert on. Baked, a stale copy passes the gate.
      - ./rbac.json:/app/rbac.json:ro
      # NOT read-only, and not baked: seed_data.py WRITES planted_truth.json here and the gates
      # read it back. Baked into the image, the seed wrote to a container that was then discarded
      # and every gate scored the previous run's fixture.
      - ./fixtures:/app/fixtures
      # Source-only, for the static cross-checks that compare dashboard route policy against the
      # sidebar. Without it those tests SKIP, which reads as green and guards nothing.
      - ./analytics-dashboard/src:/app/analytics-dashboard/src:ro
      # schema.sql is compared against the live database; baked into the image the test
      # reads a stale copy and reports drift that was already fixed.
      - ./storage:/app/storage:ro
      # NexaBank source for the producer-side guards. .dockerignore excludes NexaBank/ from this
      # image's build CONTEXT, so it can never be baked in -- a bind mount is the only way these
      # tests see it. Just the two subtrees they read, not the whole tree with its node_modules.
      - ./NexaBank/backend/src:/app/NexaBank/backend/src:ro
      - ./NexaBank/frontend/lib:/app/NexaBank/frontend/lib:ro
    command: python -m pytest tests/ -q

  # ═══════════════════════════════════════════════════════════
  # Playwright end-to-end tests. Official image so the browsers are
  # already present -- installing Chromium into the app images would
  # bloat every runtime container for a dev-only tool.
  #   docker compose --profile test run --rm e2e
  # ═══════════════════════════════════════════════════════════

  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /e2e
    environment:
      - DASHBOARD_URL=http://analytics-dashboard:3001
      - NEXABANK_URL=http://nexabank-frontend:3002
      - NEXTAUTH_SECRET=nucleus-analytics-secret-key-2026
      - CI=${CI:-}
    volumes:
      - ./e2e:/e2e
      # rbac.json decides which role an email resolves to; the specs assert against it.
      - ./rbac.json:/rbac.json:ro
    # npm ci on first run; the node_modules volume keeps it out of the repo.
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"


volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  vllm_data:
    driver: local
