services:
  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  broker:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Without this, dependents start as soon as the CONTAINER starts rather than when Kafka
    # is accepting connections. ingestion-api lost that race every time, gave up, and ran on
    # the ClickHouse fallback for its whole lifetime -- silently, since it never crashed.
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker:29092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  init-kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      broker:
        condition: service_healthy
    restart: on-failure
    command: "bash -c 'echo Waiting for Kafka to be ready... && cub kafka-ready -b broker:29092 1 120 && kafka-topics --create --topic feature-events --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server broker:29092'"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      # No docker-entrypoint-initdb.d mount: schema is applied by the one-shot
      # `migrate` service (warehouse/migrate.py), so there is one code path that
      # builds the schema, not two that can drift.
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      # P0-1: today() is server-local. Unpinned, the KPI card, the traffic chart and the rollup
      # bucket the same event into different days.
      TZ: UTC
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ═══════════════════════════════════════════════════════════
  # SCHEMA MIGRATION — one-shot, runs to completion before any service reads/writes
  # ═══════════════════════════════════════════════════════════

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
    command: python warehouse/migrate.py
    restart: "no"

  # ═══════════════════════════════════════════════════════════
  # NUCLEUS PYTHON BACKEND SERVICES
  # ═══════════════════════════════════════════════════════════

  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKER_URL=broker:29092
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - PIPELINE_URL=http://pipeline:8003
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  processor-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKER_URL=broker:29092
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
    command: python pipeline/worker.py
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8003:8003"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - PIPELINE_TENANTS=nexabank
      - EXTRACT_API_URL=http://nexabank-backend:5000/api
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
      - ENABLE_DEV_SEED=${ENABLE_DEV_SEED:-1}
      - PIPELINE_RUN_ON_START=${PIPELINE_RUN_ON_START:-0}
      - PIPELINE_EXTRACT_INTERVAL_S=${PIPELINE_EXTRACT_INTERVAL_S:-600}
      - PIPELINE_TRANSFORM_INTERVAL_S=${PIPELINE_TRANSFORM_INTERVAL_S:-600}
    command: uvicorn pipeline.service:app --host 0.0.0.0 --port 8003
    restart: unless-stopped

  intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      analytics-api:
        condition: service_started
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - INTELLIGENCE_TENANTS=nexabank
      - INTELLIGENCE_WINDOW_DAYS=7
      - INTELLIGENCE_DATASET=seeded
      - EXTRACT_API_URL=http://nexabank-backend:5000/api
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
      - INTELLIGENCE_LLM=${INTELLIGENCE_LLM:-0}
      - VLLM_URL=http://host.docker.internal:11434/v1
      - METRIC_API_URL=http://analytics-api:8001
    volumes:
      - ./api:/app/api
      - ./contracts:/app/contracts:ro
    command: python api/intelligence/service.py
    restart: unless-stopped

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      - VLLM_URL=http://host.docker.internal:11434/v1
      - INTELLIGENCE_LLM=${INTELLIGENCE_LLM:-0}
      - METRIC_API_TENANTS=${METRIC_API_TENANTS:-nexabank}
    volumes:
      # Contracts are configuration, not code: both readers must see the same file.
      - ./contracts:/app/contracts:ro
    # Phase 4: the Metric API is the doorway. Phase 5 folds the dashboard + /intelligence/*
    # read endpoints onto this same app; api/main.py is deleted then.
    command: uvicorn api.dashboard_api.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # vLLM High-Throughput Inference Server
  # ═══════════════════════════════════════════════════════════

  vllm-server:
    # Opt-in: needs an NVIDIA GPU. `docker compose --profile gpu up vllm-server`
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    container_name: fininsights-vllm
    ports:
      - "8002:8000"
    volumes:
      - vllm_data:/root/.cache/huggingface
      - ./vllm_entrypoint.sh:/app/vllm_entrypoint.sh:ro
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Pin the weights instead of letting free VRAM choose a tier. Empty = auto-select.
      - VLLM_MODEL=${VLLM_MODEL:-}
      - VLLM_MAX_LEN=${VLLM_MAX_LEN:-}
      - VLLM_GPU_UTIL=${VLLM_GPU_UTIL:-}
      # vLLM's CUDA platform disables pinned memory on WSL2 by default. Its V1 GPU model runner
      # then cannot build a UVA buffer and the engine dies with "UVA is not available" before
      # loading a single weight. Pinned memory does work on WSL2 kernels >= 4.19.121, which is
      # every current one; this opts back in. Harmless on native Linux, where the WSL branch is
      # never taken.
      - VLLM_WSL2_ENABLE_PIN_MEMORY=${VLLM_WSL2_ENABLE_PIN_MEMORY:-1}
      # huggingface_hub's Xet transfer path fails mid-download behind some networks with
      # "CAS Client Error: Request middleware error", and the engine dies before loading a weight.
      # Plain HTTPS is slower on a cold pull and survives a flaky link.
      - HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    entrypoint: ["/bin/bash", "/app/vllm_entrypoint.sh"]
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # ANALYTICS DASHBOARD — port 3001
  # ═══════════════════════════════════════════════════════════

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fininsights-dashboard
    ports:
      - "3001:3001"
    environment:
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=nucleus-analytics-secret-key-2026
      - ANALYTICS_API_HOST=analytics-api
      - INGESTION_API_HOST=ingestion-api
      - NEXT_PUBLIC_ANALYTICS_WS_URL=ws://analytics-api:8001
      - NEXT_MODE=${NEXT_MODE:-development}
    env_file:
      - ./dashboard/.env.local
    volumes:
      # Mount central RBAC config
      - ./rbac.json:/rbac.json:ro
      # Hot-reload: mount source directories
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
    depends_on:
      - analytics-api
      - ingestion-api
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # NEXABANK — Backend (5000) + Frontend (3002)
  # ═══════════════════════════════════════════════════════════

  nexabank-backend:
    build:
      context: ./nexabank/backend
      dockerfile: Dockerfile
    container_name: nexabank-backend
    ports:
      - "5000:5000"
    env_file:
      - ./nexabank/backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:3002
      - INGESTION_API_URL=http://ingestion-api:8000/events
      # Shared secret for the batch extract; the endpoints refuse to serve without it.
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
    volumes:
      # Hot-reload: mount source code (but NOT node_modules)
      - ./nexabank/backend/src:/app/src
      - ./nexabank/backend/prisma:/app/prisma
    restart: unless-stopped

  nexabank-frontend:
    build:
      context: ./nexabank/frontend
      dockerfile: Dockerfile
    container_name: nexabank-frontend
    ports:
      - "3002:3002"
    environment:
      - NEXT_MODE=${NEXT_MODE:-development}
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    volumes:
      # Hot-reload: mount source directories
      - ./nexabank/frontend/app:/app/app
      - ./nexabank/frontend/components:/app/components
      - ./nexabank/frontend/hooks:/app/hooks
      - ./nexabank/frontend/lib:/app/lib
      - ./nexabank/frontend/types:/app/types
      - ./nexabank/frontend/public:/app/public
    depends_on:
      - nexabank-backend
      - ingestion-api
    restart: unless-stopped

  # Operator tooling: seeding, gates, data-quality checks. Dev deps and node live only here.
  #   docker compose --profile tools run --rm tools python scripts/seed_data.py
  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "1"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse
      # Service names, not localhost -- inside a container localhost is the container itself.
      - INGEST_URL=http://ingestion-api:8000/events
      - ANALYTICS_URL=http://analytics-api:8001/metrics/realtime_users
      - EXTRACT_API_URL=http://nexabank-backend:5000/api
      - EXTRACT_API_TOKEN=${EXTRACT_API_TOKEN:-local-dev-extract-token}
      - CLICKHOUSE_URL=http://clickhouse:8123
    volumes:
      # Mounted, not baked, so a script always reads the working copy.
      - ./scripts:/app/scripts:ro
      - ./api:/app/api:ro
      - ./contracts:/app/contracts:ro
      - ./warehouse:/app/warehouse:ro
      - ./rbac.json:/app/rbac.json:ro
      # Writable: seed_data.py writes planted_truth.json here and the gates read it back.
      - ./fixtures:/app/fixtures
      # .dockerignore excludes nexabank/ from this build context, so a mount is the only way
      # the taxonomy probe sees the real Node dialect.
      - ./nexabank/backend/src:/app/nexabank/backend/src:ro
      - ./nexabank/frontend/lib:/app/nexabank/frontend/lib:ro
    command: python scripts/verify_data_quality.py

# ═══════════════════════════════════════════════════════════
# PERSISTENT VOLUMES — survive `docker compose down`
# Only removed with `docker compose down -v`
# ═══════════════════════════════════════════════════════════
volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  kafka_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  vllm_data:
    driver: local
